name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  # The end-to-end run needs the built site and a real browser, so it is its own
  # job: it drives JupyterLite against fake cs-control and Jupyter Server hops
  # and checks the whole pipeline, not the units underneath it.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v5
      - run: bun install --frozen-lockfile
      - run: uv sync --frozen
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
